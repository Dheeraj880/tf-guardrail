name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Cheat gallery must stay at 100%
        run: tfguard eval --cases examples/cases/gallery.json
      - name: The vulnerable example must fail the gate
        run: |
          if tfguard scan examples/vulnerable; then
            echo "expected findings in examples/vulnerable"; exit 1
          fi
