# Project-specific Semgrep rules. They encode tf-guardrail's security invariants so a
# future change cannot quietly break them. Each rule has test cases in tfguard.py
# (run: semgrep --test .semgrep/).
rules:
  - id: tfguard-unverified-fix-accepted
    languages: [python]
    severity: ERROR
    message: >-
      Edits proposed by the fixer are applied to the module (`$PATCHED`) but the result is
      never passed to verifier.verify(). The model's output is untrusted: only a fix the
      deterministic verifier accepts may become the new module state.
    metadata:
      category: security
      cwe: "CWE-345: Insufficient Verification of Data Authenticity"
      owasp: "LLM05:2025 Improper Output Handling"
      confidence: HIGH
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
      - pattern: $PATCHED = apply_edits(...)
      - pattern-not-inside: |
          def $FUNC(...):
            ...
            $PATCHED = apply_edits(...)
            ...
            $V = verify($MODULE, $PATCHED, ...)
            ...
      - pattern-not-inside: |
          def $FUNC(...):
            ...
            try:
              ...
              $PATCHED = apply_edits(...)
              ...
            except $E:
              ...
            ...
            $V = verify($MODULE, $PATCHED, ...)
            ...
      - pattern-not-inside: |
          def $FUNC(...):
            ...
            for $X in $Y:
              ...
              try:
                ...
                $PATCHED = apply_edits(...)
                ...
              except $E:
                ...
              ...
              $V = verify($MODULE, $PATCHED, ...)
              ...

  - id: tfguard-untrusted-text-to-dangerous-sink
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted text reaches a code-execution, deserialization or filesystem sink.
      Terraform under review can carry prompt-injection comments, and the model's tool
      call is steerable by them, so neither may be executed, deserialized or used as a path.
    metadata:
      category: security
      cwe: "CWE-94: Improper Control of Generation of Code"
      owasp: "LLM01:2025 Prompt Injection"
      confidence: MEDIUM
    pattern-sources:
      - pattern: $CALL.input
        exact: true
      - pattern: $FIXER.propose(...)
        exact: true
      - pattern: read_dir(...)
        exact: true
      - pattern: load_files(...)
        exact: true
    pattern-sinks:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: compile(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - pattern: subprocess.$FN(...)
      - pattern: pickle.loads(...)
      - pattern: marshal.loads(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader)
      - pattern: open($PATH, ...)
      - pattern: Path($PATH)
      - pattern: $DIR / $NAME
